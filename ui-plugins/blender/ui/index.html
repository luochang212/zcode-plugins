<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ZCode Blender</title>
    <style>
      /* 占位面板：第 3 步（Three.js 预览/对象树/属性/渲染图）依赖宿主 R2/R3，先只显示引擎状态与最近一次工具输出。 */
      :root {
        color-scheme: light dark;
        --fg: #1f2328;
        --bg: #ffffff;
        --muted: #656d76;
        --line: #d0d7de;
        --accent: #0969da;
        --ok: #1a7f37;
        --bad: #cf222e;
      }
      [data-theme="dark"] {
        --fg: #e6edf3;
        --bg: #0d1117;
        --muted: #8b949e;
        --line: #30363d;
        --accent: #58a6ff;
        --ok: #3fb950;
        --bad: #ff7b72;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        display: flow-root;
      }
      main {
        padding: 10px 12px 12px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 6px;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .muted {
        color: var(--muted);
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      pre {
        margin: 6px 0 0;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: auto;
        max-height: 220px;
        font-size: 12px;
        white-space: pre-wrap;
      }
      footer {
        padding: 6px 12px 10px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Blender <span id="tier" class="muted">engine status unknown</span></h1>
      <div id="summary" class="muted">Waiting for tool output…</div>
      <div id="engine" class="muted"></div>
      <pre id="state"></pre>
    </main>
    <footer><span id="host-info"></span><span id="display-mode"></span></footer>
    <script>
      (function () {
        const api = window.zcode;
        const $ = (id) => document.getElementById(id);
        if (!api) {
          $("summary").textContent = "window.zcode 不可用：请在 ZCode 桌面端的插件沙箱里打开。";
          return;
        }
        function render() {
          document.documentElement.dataset.theme = api.theme === "dark" ? "dark" : "light";
          $("host-info").textContent = `theme=${api.theme ?? "?"} locale=${api.locale ?? "?"}`;
          $("display-mode").textContent = `displayMode=${api.displayMode ?? "?"}`;
          const out = api.toolOutput || null;
          const state = out && out.state;
          const engine = out && out.engine;
          if (engine) {
            const full = engine.kind !== "none";
            $("tier").textContent = full
              ? `engine: ${engine.kind}${engine.version ? " " + engine.version : ""}`
              : "glTF-only (no engine)";
            $("tier").className = full ? "ok" : "bad";
            $("engine").textContent = engine.path || engine.reason || "";
          } else if (state && state.engine) {
            $("tier").textContent = `Blender ${state.engine.version} · ${state.engine.render}`;
            $("tier").className = "ok";
          }
          $("summary").textContent = out
            ? state
              ? `${state.file || "(unsaved scene)"} · revision ${state.revision} · selected ${(state.selected || []).join(", ") || "none"} · camera ${state.camera ? state.camera.name : "none"}`
              : "Tool output received."
            : "Waiting for tool output…";
          $("state").textContent = out ? JSON.stringify(out, null, 2).slice(0, 4000) : "";
          if (state)
            api
              .setWidgetState({
                ...(api.widgetState || {}),
                file: state.file,
                selected: state.selected,
                cameraPose: state.camera,
                tab: "scene",
              })
              .catch(() => {});
          api.notifyIntrinsicHeight(Math.ceil(document.body.getBoundingClientRect().height));
        }
        window.addEventListener("zcode:globals", render);
        render();
      })();
    </script>
  </body>
</html>
